<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Seaweed+Script&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sekuya&display=swap" rel="stylesheet">
</head>

<body>
    
    <div class="container">
        <div class="header">
            <div class="todo-app">

                <h1 class="heading">My TO-DO List</h1>
                <h4 class="small_heading">Stay organised and Productive</h4>
            </div>
            <br>
            <div class="todo-input-container">
                <input type="text" id="todoInput" class="todo-input" placeholder="ADD A NEW TASK" autocomplete="off">
                <button id="addTodoBtn" class="todo-btn">Add</button>
            </div>
            <div class="filter-container">
                <button id="all" class="filter-btn active" data-filter="all">ALL</button>
                <button id="active" class="filter-btn" data-filter="active">Active</button>
                <button id="comp" class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <ul id="todoList" class="todo-list">
                <!-- Todo items will be dynamically added here -->
                <!-- Sample todos for demonstration -->
                <li class="todo-item">
                    <input type="checkbox" class="todo-checkbox">
                    <span class="todo-text">Complete project documentation</span>
                    <button class="delete-btn">×</button>
                </li>
                <li class="todo-item completed">
                    <input type="checkbox" class="todo-checkbox" checked>
                    <span class="todo-text">Review pull requests</span>
                    <button class="delete-btn">×</button>
                </li>
                <li class="todo-item">
                    <input type="checkbox" class="todo-checkbox">
                    <span class="todo-text">Update team on progress</span>
                    <button class="delete-btn">×</button>
                </li>
            </ul>

            <div class="todo-footer">
                <button id="clearCompletedBtn" class="clear-completed">Clear Completed</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
